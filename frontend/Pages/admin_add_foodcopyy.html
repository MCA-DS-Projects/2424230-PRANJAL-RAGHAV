<!DOCTYPE html>
<html>
<head>
    <title>Admin - Manage Foods</title>
    <meta charset="UTF-8" />

    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <script>
    function get(id){ return document.getElementById(id).value }

    async function submitFood(){

        function toList(id){
            return get(id).split(",").map(v=>v.trim().toLowerCase()).filter(Boolean);
        }

        const body = {
            name: get("name"),
            image: get("image"),
            mealType: toList("mealType"),
            properties: toList("properties"),
            region: toList("region"),
            description: get("description"),
            prepTime: get("prepTime"),
            bodyTypeMsg: get("bodyTypeMsg"),
            benefits: toList("benefits"),
            ingredients: toList("ingredients")
        }

        // let res = await fetch("${window.API_BASE_URL}/api/foods/", {
        let res = await fetch(`${window.API_BASE_URL}/api/foods/`, {

            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-ADMIN-SECRET": "MY123ADMINKEY"
            },
            body: JSON.stringify(body)
        });

        let result = await res.json();
        alert(result.message);
        loadFoods();
    }

    async function loadFoods(){
        let res = await fetch("${window.API_BASE_URL}/api/foods/?page=1&limit=100");
        let data = await res.json();

        let rows = "";
        data.items.forEach(f => {
            // rows += `<tr>
            //             <td>${f.name}</td>
            //             <td><img src="${f.image}" style="width:60px;height:40px;object-fit:cover"></td>
            //             <td>${f.mealType?.join(",")}</td>
            //             <td>${f.properties?.join(",")}</td>
            //             <td>${f.region?.join(",")}</td>
            //          </tr>`;

            rows += `<tr>
    <td>${f.name}</td>
    <td><img src="${f.image}" style="width:60px;height:40px;object-fit:cover"></td>
    <td>${f.mealType?.join(",")}</td>
    <td>${f.properties?.join(",")}</td>
    <td>${f.region?.join(",")}</td>
    <td>
        <button class="btn btn-sm btn-warning" onclick="editFood('${f._id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteFood('${f._id}')">Delete</button>
    </td>
</tr>`;

        });
        document.getElementById("foodTable").innerHTML = rows;
    }

    window.onload = loadFoods;
    </script>

</head>

<body class="p-4 bg-light">

<div class="container">
    <h2 class="mb-4">Admin - Add New Food</h2>

    <div class="card p-4 mb-5 shadow-sm">
        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input id="name" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Image URL</label>
                <input id="image" class="form-control">
            </div>

            <div class="col-md-4">
                <label class="form-label">Meal Type (comma sep.)</label>
                <input id="mealType" class="form-control" placeholder="breakfast,lunch">
            </div>

            <div class="col-md-4">
                <label class="form-label">Properties (comma sep.)</label>
                <input id="properties" class="form-control" placeholder="warming,cooling">
            </div>

            <div class="col-md-4">
                <label class="form-label">Region (comma sep.)</label>
                <input id="region" class="form-control" placeholder="indian,asian">
            </div>

            <div class="col-md-12">
                <label class="form-label">Description</label>
                <textarea id="description" class="form-control" rows="2"></textarea>
            </div>

            <div class="col-md-4">
                <label class="form-label">Prep Time</label>
                <input id="prepTime" class="form-control" placeholder="15 min">
            </div>

            <div class="col-md-8">
                <label class="form-label">Body Type Message</label>
                <input id="bodyTypeMsg" class="form-control" placeholder="Perfect for Vata">
            </div>

            <div class="col-md-6">
                <label class="form-label">Benefits (comma sep.)</label>
                <input id="benefits" class="form-control" placeholder="increase strength,improves digestion">
            </div>

            <div class="col-md-6">
                <label class="form-label">Ingredients (comma sep.)</label>
                <input id="ingredients" class="form-control" placeholder="rice, milk, cinnamon">
            </div>

            <div class="col-md-12 text-end mt-3">
                <button class="btn btn-primary" onclick="submitFood()">Save Food</button>
            </div>
        </div>
    </div>


    <h3>Existing Foods</h3>
    <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Image</th>
                <th>Meal Type</th>
                <th>Properties</th>
                <th>Region</th>
            </tr>
        </thead>
        <tbody id="foodTable"></tbody>
    </table>

</div>

</body>
</html>
